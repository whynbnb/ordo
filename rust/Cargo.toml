[package]
name = "ordo_core"
version = "1.0.0"
edition = "2021"
description = "Ordo 安序 - Rust filesystem core"
license = "MIT"

[lib]
name = "ordo_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

# 远程协议：全部为纯 Rust 实现（无系统库依赖，便于交叉编译到 Android）。
smb2 = "0.26"
suppaftp = { version = "12", default-features = false }
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls-webpki-roots",
    "charset",
] }
quick-xml = "0.37"
httpdate = "1"
percent-encoding = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "time",
    "io-util",
    "sync",
] }

# 本地文件服务器：HTTP/WebDAV 使用 tiny_http（纯 Rust，无 TLS 依赖）。
tiny_http = "0.12"
base64 = "0.22"

# 压缩 / 解压：纯 Rust zip（deflate + AES 加密）、tar、gzip。
zip = { version = "2", default-features = false, features = [
    "deflate",
    "aes-crypto",
] }
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# 缩略图：纯 Rust 图片解码；sha2 用于生成缩略图缓存键。
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "gif",
    "bmp",
] }
sha2 = "0.11"

# 文件校验和工具：MD5（纯 Rust）。
md5 = "0.7"

# 图片 EXIF / 媒体信息（纯 Rust；包名 kamadak-exif，库名 exif）。
kamadak-exif = "0.6"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
strip = true
