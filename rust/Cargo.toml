[package]
name = "ordo_core"
version = "1.0.0"
edition = "2021"
description = "Ordo 安序 - Rust filesystem core"
license = "MIT"

[lib]
name = "ordo_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
strip = true
